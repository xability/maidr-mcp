[project]
name = "maidr-mcp"
version = "0.1.0"
description = "MCP server that shows accessible maidr charts in ChatGPT and Claude conversations, and lets the model move the reader through them"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JooYoung Seo", email = "jseo1005@illinois.edu" }]
keywords = ["accessibility", "mcp", "mcp-apps", "maidr", "sonification", "braille", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "maidr>=1.26,<2",
    "matplotlib>=3.9",
    "mcp>=2.2,<3",
    "mplfinance>=0.12.10b0",
    "pandas>=2.0",
    "seaborn>=0.13",
    "uvicorn>=0.31.1",
]

[project.urls]
Repository = "https://github.com/xability/maidr-mcp"

[project.scripts]
maidr-mcp = "maidr_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maidr_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "FA102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:maidr. Setting matplotlib backend:UserWarning"]
