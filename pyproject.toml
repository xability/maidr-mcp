[project]
name = "maidr-mcp"
version = "0.1.0"
description = "MCP server that shows accessible maidr charts in ChatGPT and Claude conversations, and lets the model move the reader through them"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JooYoung Seo", email = "jseo1005@illinois.edu" }]
keywords = ["accessibility", "mcp", "mcp-apps", "maidr", "sonification", "braille", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "maidr>=1.26,<2",
    "matplotlib>=3.9",
    "mcp>=2.2,<3",
    "mplfinance>=0.12.10b0",
    "pandas>=2.0",
    "seaborn>=0.13",
    "uvicorn>=0.31.1",
]

[project.urls]
Repository = "https://github.com/xability/maidr-mcp"

[project.scripts]
maidr-mcp = "maidr_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maidr_mcp"]

[tool.semantic_release]
# The release workflow (.github/workflows/release.yml) runs python-semantic-release at
# the version it pins. It bumps the version from the Conventional Commits since the last
# tag: feat -> minor, fix and perf -> patch; anything else makes no release.
version_toml = ["pyproject.toml:project.version"]
# server.json carries the version three times: its own, the PyPI package's, and the tag
# in the image's identifier. The first entry stamps both "version" keys; the second
# stamps the tag after "ghcr.io/xability/maidr-mcp:". tests/test_release.py holds the
# three to pyproject.toml's version.
version_variables = ["server.json:version", "server.json:ghcr.io/xability/maidr-mcp"]
# uv.lock records this project's own version, so `uv sync --locked` fails on a bump
# that leaves it behind.
build_command = "uv lock && uv build"
assets = ["uv.lock"]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
tag_format = "v{version}"
# Experimental, so it stays 0.x: a breaking change raises the minor version until the
# project chooses 1.0.0. python-semantic-release 10 would otherwise go to 1.0.0 at once.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "perf", "refactor", "style", "test", "build", "chore", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# Every commit on main is a squash merge whose body lists the branch's own commits. Read
# only the subject, the pull request's title, or those would each count and each be
# listed in the changelog.
parse_squash_commits = false

[tool.semantic_release.changelog]
# Leave out chore commits (the release commit itself among them). `!?` keeps a breaking
# change in.
exclude_commit_patterns = ["^(?!(feat|fix|docs|perf|refactor|test|build|ci|style)(\\(.*\\))?!?: ).*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
# List the first release's changes too, rather than a bare "Initial Release".
mask_initial_release = false

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "FA102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:maidr. Setting matplotlib backend:UserWarning"]
