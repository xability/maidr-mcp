name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before it tags a release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    # The whole loop in ext-apps' reference host: the chart shows, the model's calls are
    # answered by maidr inside it, the reader hears the moves, and the host gets the position.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Playwright's Chromium
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright-core install --with-deps chromium
      - run: bash e2e/run.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t maidr-mcp .
      - name: The image serves the tools
        run: |
          docker run -d --name maidr -p 8000:8000 maidr-mcp
          for _ in $(seq 30); do
            curl -s -o /dev/null --max-time 2 -X OPTIONS http://localhost:8000/mcp && break
            sleep 1
          done
          curl -sS -X POST http://localhost:8000/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"show_chart","arguments":{"chart":{"type":"bar","categories":["a","b"],"series":[{"values":[1,2]}]}}}}' \
            | tee /dev/stderr | grep -q '"viewId"'
          docker logs maidr
      - name: The image takes an access token from the environment, and keeps it out of its log
        run: |
          token=ci-access-token-0123456789
          docker run -d --name locked -p 8001:8000 -e MAIDR_MCP_TOKEN="$token" maidr-mcp
          for _ in $(seq 30); do
            curl -s -o /dev/null --max-time 2 -X OPTIONS http://localhost:8001/mcp && break
            sleep 1
          done
          call='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          without=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d "$call")
          test "$without" = 401
          curl -sS -o tools.out -X POST "http://localhost:8001/mcp/$token" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d "$call"
          grep -q '"show_chart"' tools.out
          docker logs locked > locked.log 2>&1
          cat locked.log
          grep -q '/mcp/<redacted>' locked.log
          if grep -q "$token" locked.log; then echo "the token is in the log"; exit 1; fi

  package:
    # What PyPI gets: the wheel, installed on its own and run as the MCP Registry tells a host
    # to, serves a chart and its view.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv run --no-project --isolated --with dist/*.whl python scripts/smoke_wheel.py
