name: release

on:
  # Weekly, Mondays at 17:53 UTC. maidr releases at 15:00 and py-maidr at 16:00, and
  # update-maidr.yml raises the pins from them in its runs at :23, so a release carries what
  # it raised that day. Late in the hour, so those runs have usually pushed by the time this
  # one tests main, and off its top, when GitHub most often delays or drops scheduled runs.
  # GitHub's cron is UTC and ignores daylight saving.
  schedule:
    - cron: "53 17 * * 1"
  workflow_dispatch:

# One run at a time. A run that has started is never cancelled; GitHub keeps one waiting
# run, and a newer waiting run replaces it.
#
# update-maidr.yml pushes to main too, and neither waits for the other. Nothing here pushes
# over a main that moved: the release job releases only the commit the tests passed on and
# otherwise starts a new run for the new main, and python-semantic-release pushes only if
# origin's main is still that commit.
concurrency:
  group: release
  cancel-in-progress: false

# Each job asks for more where it needs it. The actions are pinned to commits, since they run
# beside tokens that push tags and publish; raise them deliberately.
permissions:
  contents: read

env:
  PSR_VERSION: "10.7.0"

# setup-uv's cache is off in every job here. ci.yml's e2e job runs ext-apps' npm packages,
# installed afresh without a lockfile, and saves the uv cache under the key the release
# job, which builds what PyPI gets with a token that can push, would restore.

jobs:
  checks:
    # A scheduled run does nothing until the repository variable RELEASE_ENABLED is
    # "true", which the maintainer sets once PyPI trusts this workflow; before that, each
    # would push a tag that PyPI then refuses. A run started by hand always runs. Every
    # job after this one needs it, so a skipped check skips the whole release.
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_ENABLED == 'true'
    # ci.yml itself, so a release passes exactly what a pull request does: the tests, the
    # e2e, the image, and the wheel run as a host would run it.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    # Only main of this repository releases; a dispatch from another branch, or a fork's
    # run, stops after the tests.
    if: github.repository == 'xability/maidr-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # The release commit, the tag and the GitHub release.
      contents: write
      # A new run of this workflow, when main moved on during the tests.
      actions: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The commit the tests passed on, with every branch and tag: the next version is read
      # from the tags. The only checkout that keeps its credentials, to push the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: false
      # A re-run of this job, after an earlier attempt pushed the tag and then failed,
      # finishes that release: its tag is on the release commit, whose parent is the commit
      # the tests passed on, and PyPI does not have the version yet. Otherwise, if main has
      # moved on from that commit, the next step hands the release to a new run.
      - name: Find where the release stands
        id: state
        run: |
          for tag in $(git tag --list 'v*' --contains "$GITHUB_SHA"); do
            # --contains also lists tags on later commits; only the release commit made from
            # this one, its child, is this run's.
            [ "$(git rev-parse "$tag^{commit}^")" = "$GITHUB_SHA" ] || continue
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/maidr-mcp/${tag#v}/json" || true)
            if [ "$status" = 404 ]; then
              echo "resume=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$status" = 200 ]; then
              # A re-run of a release that went out: main is its release commit now, which
              # is no reason to start another run.
              echo "::notice::$tag, released from this commit, is already on PyPI. Nothing to do."
              echo "done=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::PyPI answered $status for maidr-mcp ${tag#v}, so whether $tag is published is unknown. Re-run this job."
              exit 1
            fi
          done
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand the release to a run on the new main
        if: steps.state.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice::main moved on from $GITHUB_SHA during the tests. A new run of this workflow tests the new main and releases it."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
      # Stamps the version (pyproject.toml, server.json, uv.lock), writes CHANGELOG.md and
      # builds dist/ from that tree. Then commits, tags vX.Y.Z, pushes both if origin's main
      # is still the tested commit, and makes the GitHub release. Without a feat, fix or
      # perf commit since the last tag it does nothing and says released=false.
      - name: Version, changelog, tag and GitHub release
        id: version
        if: steps.state.outputs.resume == '' && steps.state.outputs.moved != 'true' && steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -C main
          uvx --from "python-semantic-release==$PSR_VERSION" semantic-release -v version
      - name: Build the release an earlier attempt tagged
        if: steps.state.outputs.resume != ''
        env:
          TAG: ${{ steps.state.outputs.resume }}
        run: |
          git switch -C main "$TAG"
          uv build
      # Makes the GitHub release that attempt did not, or rewrites the notes of the one it did.
      - name: The tagged release's GitHub release
        if: steps.state.outputs.resume != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.state.outputs.resume }}
        run: uvx --from "python-semantic-release==$PSR_VERSION" semantic-release -v changelog --post-to-release-tag "$TAG"
      - name: What this run releases
        id: release
        env:
          RESUMED: ${{ steps.state.outputs.resume }}
          RELEASED: ${{ steps.version.outputs.released }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$RESUMED" ]; then
            released=true tag=$RESUMED
          elif [ "$RELEASED" = true ]; then
            released=true tag=$TAG
          else
            released=false tag=
          fi
          {
            echo "released=$released"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # A re-run replaces what an earlier attempt uploaded.
          overwrite: true
      # --clobber replaces a file an earlier attempt uploaded.
      - name: Attach the distributions to the GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # From here on the tag is pushed. If any job fails, fix the cause and use "Re-run failed
  # jobs" on this run; the release job, re-run, finishes the release it tagged. A new run
  # would start from the tag and publish nothing.

  pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/maidr-mcp/${{ needs.release.outputs.version }}/
    permissions:
      # PyPI trusted publishing: PyPI trusts this repository, workflow file and
      # environment, so no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false
      # --check-url skips a file PyPI already has, so a re-run after a partial upload
      # finishes it.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  ghcr:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile labels the image with its MCP Registry name; the source label links
      # the package to this repository.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xability/maidr-mcp:${{ needs.release.outputs.version }}
            ghcr.io/xability/maidr-mcp:latest
          labels: |
            org.opencontainers.image.source=https://github.com/xability/maidr-mcp
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

  mcp-registry:
    needs: [release, pypi, ghcr]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher's GitHub OIDC login, which grants the io.github.xability namespace.
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # Raise both together, from the release's registry_<version>_checksums.txt. An
      # "invalid audience" error from login means the registry needs a newer one.
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json names this release
        run: |
          jq -e --arg v "$VERSION" '
            .version == $v
            and ([.packages[] | select(.registryType == "pypi") | .version] == [$v])
            and ([.packages[] | select(.registryType == "oci") | .identifier]
                 == ["ghcr.io/xability/maidr-mcp:" + $v])
          ' server.json
      # The registry proves ownership from the package's README on PyPI, which can take a
      # moment to serve a new release.
      - name: Wait for PyPI to serve the release
        run: |
          for _ in $(seq 30); do
            curl -fs -o /dev/null "https://pypi.org/pypi/maidr-mcp/$VERSION/json" && exit 0
            sleep 10
          done
          echo "::error::PyPI does not serve maidr-mcp $VERSION after five minutes."
          exit 1
      # The registry reads the image's label without credentials, so the package has to be
      # public, which a new GHCR package may not be.
      - name: The image is public
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:xability/maidr-mcp:pull" | jq -r .token)
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/xability/maidr-mcp/manifests/$VERSION"; then
            echo "::error::ghcr.io/xability/maidr-mcp:$VERSION cannot be pulled anonymously. Make the package public (its Package settings, Change visibility), then re-run this job."
            exit 1
          fi
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
